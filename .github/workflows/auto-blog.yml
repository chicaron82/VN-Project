# Auto-Blog — generates a TimelineEntry for every push to main
# NOTE: Add OPENAI_API_KEY to repo Settings → Secrets and variables → Actions

name: Auto Blog

on:
  push:
    branches:
      - main

# Prevent infinite loops triggered by the bot's own commits
# and allow the job to write back to the repo.
permissions:
  contents: write

jobs:
  auto-blog:
    name: Generate Blog Entry
    runs-on: ubuntu-latest

    # Skip if the push was made by the auto-blog bot itself
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate blog entry
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_DATE: ${{ github.event.head_commit.timestamp }}
          # Build a newline-separated list of all changed files from the head commit
          CHANGED_FILES: "${{ join(github.event.head_commit.added, '\n') }}\n${{ join(github.event.head_commit.modified, '\n') }}\n${{ join(github.event.head_commit.removed, '\n') }}"
        run: node scripts/auto-blog-entry.js

      - name: Regenerate timeline index
        run: npm run generate:timeline

      - name: Commit and push new entry
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add showcase/data/blog/entries showcase/data/blog/index.ts
          # Only commit if there are staged changes
          git diff --cached --quiet || git commit -m "📝 auto-blog: ${{ github.event.head_commit.message }}"
          git push
