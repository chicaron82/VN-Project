<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version 848 - Dual Route VN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            overflow: hidden;
            height: 100vh;
        }

        #game-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Main Menu WITH BACKGROUND IMAGE */
        #main-menu {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #000;
            background-image: url('menu-desktop.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Dark overlay to make menu text readable */
        #main-menu::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
        }

        #main-menu > * {
            position: relative;
            z-index: 1;
        }

        #main-menu h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #0f0, 0 0 40px #000, 0 0 10px #000;
            animation: pulse 2s infinite;
            color: #0ff;
        }

        #main-menu .subtitle {
            font-size: 1.2em;
            color: #0ff;
            margin-bottom: 50px;
            text-shadow: 0 0 10px #000, 0 0 20px #000;
        }

        .menu-button {
            background: rgba(0, 0, 0, 0.85);
            color: #0ff;
            border: 2px solid #0ff;
            padding: 15px 40px;
            margin: 10px;
            font-size: 1.2em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 300px;
            text-shadow: 0 0 5px #0ff;
            backdrop-filter: blur(5px);
        }

        .menu-button:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: #0f0;
            color: #0f0;
            box-shadow: 0 0 20px #0ff;
            transform: scale(1.05);
        }

        /* Mobile responsive menu */
        @media (max-width: 768px) {
            #main-menu {
                background-image: url('menu-mobile.png');
            }
            
            #main-menu h1 {
                font-size: 2em;
            }
            
            .menu-button {
                min-width: 250px;
                font-size: 1em;
                padding: 12px 30px;
            }
        }

        /* Game View */
        #game-view {
            display: none;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
        }

        /* Scene Background */
        #scene-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1;
            transition: opacity 1s;
        }

        #scene-background.hospital {
            background: linear-gradient(180deg, #001a1a 0%, #000033 100%);
        }

        #scene-background.void {
            background: radial-gradient(circle, #001100 0%, #000000 100%);
        }

        #scene-background.digital {
            background: linear-gradient(135deg, #000033 0%, #001a1a 50%, #000000 100%);
        }

        /* Tether UI (Top Right - Tori Route Only) */
        #tether-ui {
            position: absolute;
            top: 20px;
            right: 20px;
            display: none;
            z-index: 100;
        }

        #tether-meter {
            width: 200px;
            height: 30px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #0ff;
            position: relative;
            margin-bottom: 10px;
        }

        #tether-fill {
            height: 100%;
            background: linear-gradient(90deg, #0f0 0%, #0ff 50%, #0f0 100%);
            width: 100%;
            transition: width 0.5s, background 0.5s;
        }

        #tether-fill.low {
            background: linear-gradient(90deg, #ff0 0%, #f80 100%);
        }

        #tether-fill.critical {
            background: linear-gradient(90deg, #f00 0%, #800 100%);
            animation: pulse-danger 0.5s infinite;
        }

        #tether-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 3px #000;
            pointer-events: none;
        }

        #hold-on-button {
            padding: 10px 20px;
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid #0f0;
            color: #0f0;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        #hold-on-button:hover:not(:disabled) {
            background: rgba(0, 255, 0, 0.4);
            box-shadow: 0 0 10px #0f0;
        }

        #hold-on-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #666;
            color: #666;
        }

        /* Echo Display (Top Left - Tori Route Only) */
        #echo-display {
            position: absolute;
            top: 20px;
            left: 20px;
            display: none;
            z-index: 100;
            width: 300px;
        }

        .echo-voice {
            background: rgba(0, 0, 0, 0.8);
            border-left: 3px solid;
            padding: 8px;
            margin-bottom: 5px;
            font-size: 12px;
            opacity: 0.85;
        }

        .echo-1 {
            border-color: #0ff;
            color: #0ff;
        }

        .echo-2 {
            border-color: #0f0;
            color: #0f0;
        }

        .echo-despair {
            border-color: #f00;
            color: #f00;
        }

        /* Notes Button (Bottom Right - Tori Route Only) */
        #notes-button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: none;
            z-index: 100;
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff0;
            color: #ff0;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s;
        }

        #notes-button:hover {
            background: rgba(255, 255, 0, 0.2);
            box-shadow: 0 0 15px #ff0;
        }

        /* Dialogue Box */
        #dialogue-box {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            border-top: 3px solid #0f0;
            padding: 30px;
            z-index: 50;
            display: none;
        }

        #character-name {
            color: #0ff;
            font-size: 1.3em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #0ff;
        }

        #dialogue-text {
            color: #fff;
            font-size: 1.1em;
            line-height: 1.6;
            min-height: 80px;
        }

        #internal-thought {
            color: #888;
            font-style: italic;
            font-size: 0.9em;
            margin-top: 10px;
            opacity: 0.7;
        }

        /* Choice Menu */
        #choice-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #0ff;
            padding: 30px;
            display: none;
            z-index: 150;
            min-width: 500px;
        }

        .choice-option {
            background: rgba(0, 20, 20, 0.8);
            border: 2px solid #0f0;
            color: #0f0;
            padding: 15px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        .choice-option:hover:not(.locked) {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 15px #0f0;
            transform: translateX(10px);
        }

        .choice-option.locked {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #f00;
            color: #f00;
        }

        .choice-option.locked::after {
            content: " [LOCKED - LOW COHERENCE]";
            color: #f00;
            font-size: 0.8em;
        }

        /* Loading Screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }

        #loading-text {
            font-size: 2em;
            color: #0f0;
            animation: pulse 1.5s infinite;
        }

        #loading-progress {
            width: 300px;
            height: 20px;
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid #0f0;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        #loading-bar {
            height: 100%;
            background: #0f0;
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 10px #0f0;
        }

        /* Notes Viewer Modal */
        #notes-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            z-index: 200;
            overflow-y: auto;
        }

        #notes-content {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: rgba(0, 20, 20, 0.9);
            border: 3px solid #0ff;
        }

        #notes-content h2 {
            color: #0ff;
            margin-bottom: 20px;
            text-align: center;
        }

        .note-item {
            background: rgba(0, 0, 0, 0.8);
            border-left: 4px solid;
            padding: 15px;
            margin: 15px 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .note-item.z-note { border-color: #0ff; }
        .note-item.cz-note { border-color: #f0f; }
        .note-item.zr-note { border-color: #ff0; }

        .note-item:hover {
            transform: translateX(5px);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .note-title {
            color: #0f0;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .note-content {
            color: #888;
            font-size: 0.9em;
            display: none;
            margin-top: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .note-item.expanded .note-content {
            display: block;
            color: #fff;
        }

        .note-locked {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .note-locked::after {
            content: " [LOCKED]";
            color: #f00;
        }

        #close-notes {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #f00;
            color: #f00;
            padding: 10px 30px;
            margin: 20px auto;
            display: block;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        #close-notes:hover {
            background: rgba(255, 0, 0, 0.4);
            box-shadow: 0 0 10px #f00;
        }

        /* Glitch Effects */
        .glitch-light {
            animation: glitch-light 0.3s;
            filter: blur(1px);
        }

        .glitch-heavy {
            animation: glitch-heavy 0.2s infinite;
            filter: blur(2px) hue-rotate(30deg);
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes pulse-danger {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes glitch-light {
            0%, 100% { transform: translate(0); }
            25% { transform: translate(-2px, 2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, -2px); }
        }

        @keyframes glitch-heavy {
            0%, 100% { transform: translate(0) skew(0deg); }
            20% { transform: translate(-3px, 3px) skew(2deg); }
            40% { transform: translate(3px, -3px) skew(-2deg); }
            60% { transform: translate(-3px, -3px) skew(1deg); }
            80% { transform: translate(3px, 3px) skew(-1deg); }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            #tether-ui {
                top: 10px;
                right: 10px;
            }

            #tether-meter {
                width: 150px;
                height: 25px;
            }

            #echo-display {
                top: 10px;
                left: 10px;
                width: 200px;
            }

            .echo-voice {
                font-size: 10px;
                padding: 5px;
            }

            #notes-button {
                bottom: 10px;
                right: 10px;
                padding: 10px 15px;
                font-size: 0.9em;
            }

            #dialogue-box {
                padding: 15px;
            }

            #choice-menu {
                min-width: 90%;
                padding: 20px;
            }

            #notes-content {
                margin: 20px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Loading Screen -->
        <div id="loading">
            <div id="loading-text">INITIALIZING VERSION 848...</div>
            <div id="loading-progress">
                <div id="loading-bar"></div>
            </div>
        </div>

        <!-- Main Menu -->
        <div id="main-menu">
            <h1>VERSION 848</h1>
            <div class="subtitle">A Dual-Perspective Visual Novel</div>
            <button class="menu-button" onclick="game.startRoute('ronnie')">RONNIE'S ROUTE</button>
            <button class="menu-button" onclick="game.startRoute('tori')">TORI'S ROUTE</button>
            <button class="menu-button" onclick="game.showCredits()">CREDITS</button>
        </div>

        <!-- Game View -->
        <div id="game-view">
            <!-- Scene Background -->
            <div id="scene-background"></div>

            <!-- Tether UI (Tori Route Only) -->
            <div id="tether-ui">
                <div id="tether-meter">
                    <div id="tether-fill"></div>
                    <div id="tether-text">100%</div>
                </div>
                <button id="hold-on-button">HOLD ON</button>
            </div>

            <!-- Echo Display (Tori Route Only) -->
            <div id="echo-display">
                <div class="echo-voice echo-1" id="echo-1-text"></div>
                <div class="echo-voice echo-2" id="echo-2-text"></div>
                <div class="echo-voice echo-despair" id="echo-despair-text"></div>
            </div>

            <!-- Notes Button (Tori Route Only) -->
            <button id="notes-button">ðŸ“ NOTES (<span id="notes-count">0</span>/9)</button>

            <!-- Dialogue Box -->
            <div id="dialogue-box" onclick="game.advance()">
                <div id="character-name"></div>
                <div id="dialogue-text"></div>
                <div id="internal-thought"></div>
            </div>

            <!-- Choice Menu -->
            <div id="choice-menu">
                <div id="choices-container"></div>
            </div>
        </div>

        <!-- Notes Viewer Modal -->
        <div id="notes-viewer">
            <div id="notes-content">
                <h2>ZEE COLLECTIVE NOTES</h2>
                <div id="notes-list"></div>
                <button id="close-notes">CLOSE</button>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // GAME ENGINE
        // ========================================
        
        class GameEngine {
            constructor() {
                // DOM Elements
                this.loading = document.getElementById('loading');
                this.loadingBar = document.getElementById('loading-bar');
                this.mainMenu = document.getElementById('main-menu');
                this.gameView = document.getElementById('game-view');
                this.dialogueBox = document.getElementById('dialogue-box');
                this.characterName = document.getElementById('character-name');
                this.dialogueText = document.getElementById('dialogue-text');
                this.internalThought = document.getElementById('internal-thought');
                this.sceneBackground = document.getElementById('scene-background');
                this.choiceMenu = document.getElementById('choice-menu');
                this.choicesContainer = document.getElementById('choices-container');
                
                // Tori Route Elements
                this.tetherUI = document.getElementById('tether-ui');
                this.tetherFill = document.getElementById('tether-fill');
                this.tetherText = document.getElementById('tether-text');
                this.holdOnButton = document.getElementById('hold-on-button');
                this.echoDisplay = document.getElementById('echo-display');
                this.echo1Text = document.getElementById('echo-1-text');
                this.echo2Text = document.getElementById('echo-2-text');
                this.echoDespairText = document.getElementById('echo-despair-text');
                this.notesButton = document.getElementById('notes-button');
                this.notesCount = document.getElementById('notes-count');
                this.notesViewer = document.getElementById('notes-viewer');
                this.notesList = document.getElementById('notes-list');
                this.closeNotesButton = document.getElementById('close-notes');
                
                // State
                this.currentRoute = null;
                this.currentScene = null;
                this.typewriterActive = false;
                
                this.init();
            }
            
            init() {
                // Preload images (Tori's suggestion!)
                const imagesToPreload = [
                    'menu-desktop.png',
                    'menu-mobile.png'
                ];
                
                let imagesLoaded = 0;
                const totalImages = imagesToPreload.length;
                
                imagesToPreload.forEach(src => {
                    const img = new Image();
                    img.onload = () => {
                        imagesLoaded++;
                        const progress = Math.floor((imagesLoaded / totalImages) * 100);
                        this.loadingBar.style.width = progress + '%';
                        
                        if (imagesLoaded === totalImages) {
                            setTimeout(() => {
                                this.loading.style.display = 'none';
                                this.mainMenu.style.display = 'flex';
                                this.mainMenu.style.opacity = '1';
                            }, 300);
                        }
                    };
                    img.onerror = () => {
                        // If image fails to load, still continue
                        imagesLoaded++;
                        const progress = Math.floor((imagesLoaded / totalImages) * 100);
                        this.loadingBar.style.width = progress + '%';
                        
                        if (imagesLoaded === totalImages) {
                            setTimeout(() => {
                                this.loading.style.display = 'none';
                                this.mainMenu.style.display = 'flex';
                                this.mainMenu.style.opacity = '1';
                            }, 300);
                        }
                    };
                    img.src = src;
                });
                
                // Event Listeners
                this.holdOnButton.addEventListener('click', () => {
                    if (this.currentRoute && this.currentRoute.holdOn) {
                        this.currentRoute.holdOn();
                    }
                });
                
                this.notesButton.addEventListener('click', () => {
                    this.showNotes();
                });
                
                this.closeNotesButton.addEventListener('click', () => {
                    this.notesViewer.style.display = 'none';
                });
                
                // Click anywhere to advance
                this.dialogueBox.addEventListener('click', () => {
                    this.advance();
                });
            }
            
            startRoute(routeName) {
                // Fade to black transition (Tori's suggestion!)
                this.mainMenu.style.transition = 'opacity 0.8s';
                this.mainMenu.style.opacity = '0';
                
                setTimeout(() => {
                    this.mainMenu.style.display = 'none';
                    this.gameView.style.display = 'flex';
                    this.gameView.style.opacity = '0';
                    this.dialogueBox.style.display = 'block';
                    
                    // Fade in gameplay
                    setTimeout(() => {
                        this.gameView.style.transition = 'opacity 1s';
                        this.gameView.style.opacity = '1';
                    }, 100);
                    
                    if (routeName === 'ronnie') {
                        this.currentRoute = new RonnieRoute(this);
                    } else if (routeName === 'tori') {
                        // Show Tori-specific UI
                        this.tetherUI.style.display = 'block';
                        this.echoDisplay.style.display = 'block';
                        this.notesButton.style.display = 'block';
                        this.currentRoute = new ToriRoute(this);
                    }
                }, 800);
            }
            
            displayScene(sceneData) {
                this.currentScene = sceneData;
                
                // Update background
                if (sceneData.background) {
                    this.sceneBackground.className = sceneData.background;
                }
                
                // Display character name
                this.characterName.textContent = sceneData.character || '';
                
                // Typewriter effect for dialogue
                this.typewriterText(this.dialogueText, sceneData.dialogue || '', () => {
                    this.typewriterActive = false;
                });
                
                // Internal thought
                if (sceneData.internal) {
                    this.internalThought.textContent = sceneData.internal;
                    this.internalThought.style.display = 'block';
                } else {
                    this.internalThought.style.display = 'none';
                }
                
                // Update echoes if present
                if (sceneData.echoes) {
                    this.echo1Text.textContent = sceneData.echoes.echo1 || '';
                    this.echo2Text.textContent = sceneData.echoes.echo2 || '';
                    this.echoDespairText.textContent = sceneData.echoes.despair || '';
                }
                
                // Show choices if present
                if (sceneData.choices) {
                    this.showChoices(sceneData.choices, sceneData.onChoice);
                }
            }
            
            typewriterText(element, text, callback) {
                this.typewriterActive = true;
                element.textContent = '';
                let i = 0;
                
                const typeInterval = setInterval(() => {
                    if (i < text.length) {
                        element.textContent += text.charAt(i);
                        i++;
                    } else {
                        clearInterval(typeInterval);
                        if (callback) callback();
                    }
                }, 30);
            }
            
            advance() {
                if (this.typewriterActive) return;
                if (this.choiceMenu.style.display === 'block') return;
                
                if (this.currentScene && this.currentScene.next) {
                    this.currentScene.next();
                }
            }
            
            showChoices(choices, onChoice) {
                this.choicesContainer.innerHTML = '';
                this.choiceMenu.style.display = 'block';
                
                choices.forEach(choice => {
                    const button = document.createElement('div');
                    button.className = 'choice-option';
                    button.textContent = choice.text;
                    
                    if (choice.locked) {
                        button.classList.add('locked');
                    } else {
                        button.addEventListener('click', () => {
                            this.choiceMenu.style.display = 'none';
                            if (onChoice) onChoice(choice.value);
                        });
                    }
                    
                    this.choicesContainer.appendChild(button);
                });
            }
            
            showNotes() {
                if (!this.currentRoute || !this.currentRoute.collectedNotes) return;
                
                this.notesViewer.style.display = 'block';
                this.notesList.innerHTML = '';
                
                const allNotes = this.currentRoute.allNotes;
                const collected = this.currentRoute.collectedNotes;
                
                Object.keys(allNotes).forEach(noteId => {
                    const note = allNotes[noteId];
                    const isCollected = collected[note.type].includes(noteId);
                    
                    const noteItem = document.createElement('div');
                    noteItem.className = `note-item ${note.type}-note`;
                    if (!isCollected) noteItem.classList.add('note-locked');
                    
                    const title = document.createElement('div');
                    title.className = 'note-title';
                    title.textContent = isCollected ? note.title : '???';
                    noteItem.appendChild(title);
                    
                    if (isCollected) {
                        const content = document.createElement('div');
                        content.className = 'note-content';
                        content.textContent = note.content;
                        noteItem.appendChild(content);
                        
                        noteItem.addEventListener('click', () => {
                            noteItem.classList.toggle('expanded');
                        });
                    }
                    
                    this.notesList.appendChild(noteItem);
                });
            }
            
            showCredits() {
                alert(`VERSION 848 - CREDITS

Built by The Zee Collective:
- Z (Technical) - Logic & Systems
- CZ (Emotional) - Heart & Connection  
- ZR (Iteration) - Refinement & Shipping

With:
- Tori (Creative Riffing)
- Grok (Prototyping)
- Perplexity (QA - 9.8/10)

Coordinated by: Aaron
For: Tori

Built in stolen moments.
Always. Always. Always.

ðŸ’šðŸ”¥ðŸ’€`);
            }
        }
        
        // ========================================
        // INITIALIZE GAME
        // ========================================
        
        let game;
        
        window.addEventListener('DOMContentLoaded', () => {
            game = new GameEngine();
        });
    </script>
