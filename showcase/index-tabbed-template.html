<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UV7 Showcase - Tabbed Navigation</title>

    <!-- Existing styles -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- New tab styles -->
    <link rel="stylesheet" href="css/tabs.css">
</head>

<body>
    <!-- UV7 Status Bar (existing) -->
    <div id="uv7-status-bar" class="status-bar">
        <!-- ... existing status bar content ... -->
    </div>

    <!-- Hero Section (collapsible) -->
    <section id="hero-section">
        <h1 class="hero-title">UV7 Showcase</h1>

        <!-- Hero Carousel (existing preview slider) -->
        <div class="hero-carousel">
            <!-- V1 vs V2 comparison cards -->
            <div class="hero-carousel-card">
                <h2>V1: Organic Chaos</h2>
                <!-- ... -->
            </div>
            <div class="hero-carousel-card">
                <h2>V2: Refined Vision</h2>
                <!-- ... -->
            </div>
        </div>
    </section>

    <!-- Tab Bar (NEW) -->
    <div class="tab-bar-container">
        <div id="tab-bar" class="tab-bar" role="tablist">
            <button class="tab-item" data-tab="journey" role="tab" aria-selected="true">
                <span class="tab-icon">🗺️</span>
                <span class="tab-label">Journey</span>
            </button>
            <button class="tab-item" data-tab="workflow" role="tab" aria-selected="false">
                <span class="tab-icon">⚙️</span>
                <span class="tab-label">Workflow</span>
            </button>
            <button class="tab-item" data-tab="results" role="tab" aria-selected="false">
                <span class="tab-icon">📊</span>
                <span class="tab-label">Results</span>
            </button>
            <button class="tab-item" data-tab="spotlight" role="tab" aria-selected="false">
                <span class="tab-icon">💡</span>
                <span class="tab-label">Spotlight</span>
            </button>
            <button class="tab-item" data-tab="evolution" role="tab" aria-selected="false">
                <span class="tab-icon">🔄</span>
                <span class="tab-label">Evolution</span>
            </button>
            <button class="tab-item" data-tab="who" role="tab" aria-selected="false">
                <span class="tab-icon">👥</span>
                <span class="tab-label">Who</span>
            </button>
        </div>
        <div id="tab-progress" class="tab-progress">●○○○○○ 1 of 6</div>
    </div>

    <!-- Tab Panels Container (NEW) -->
    <div class="tab-panels-container">
        <!-- Journey Panel -->
        <div class="tab-panel active" data-panel="journey" role="tabpanel" aria-labelledby="tab-journey"
            aria-hidden="false">
            <div class="content-wrapper">
                <h2>🗺️ The Journey</h2>

                <!-- Timeline Section (existing content, 3 phases visible) -->
                <div class="timeline-section">
                    <div class="timeline-item">
                        <h3>Phase 1: Foundation</h3>
                        <!-- ... existing timeline content ... -->
                    </div>
                    <div class="timeline-item">
                        <h3>Phase 2: Core Features</h3>
                        <!-- ... -->
                    </div>
                    <div class="timeline-item">
                        <h3>Phase 3: Polish</h3>
                        <!-- ... -->
                    </div>

                    <button class="expand-timeline-btn">View Full Timeline →</button>
                </div>
            </div>
        </div>

        <!-- Workflow Panel -->
        <div class="tab-panel" data-panel="workflow" role="tabpanel" aria-labelledby="tab-workflow" aria-hidden="true">
            <div class="content-wrapper">
                <h2>⚙️ How UV7 Crew Works</h2>

                <!-- Workflow content (existing) -->
                <div class="workflow-grid">
                    <!-- DiZee, Zee, GenZee collaboration cards -->
                </div>
            </div>
        </div>

        <!-- Results Panel -->
        <div class="tab-panel" data-panel="results" role="tabpanel" aria-labelledby="tab-results" aria-hidden="true">
            <div class="content-wrapper">
                <h2>📊 Results & Metrics</h2>

                <!-- Stats cards (existing) -->
                <div class="stats-grid">
                    <!-- Dynamic stats -->
                </div>
            </div>
        </div>

        <!-- Spotlight Panel -->
        <div class="tab-panel" data-panel="spotlight" role="tabpanel" aria-labelledby="tab-spotlight"
            aria-hidden="true">
            <div class="content-wrapper">
                <h2>💡 Technical Spotlight</h2>

                <!-- Deep dive content (existing) -->
            </div>
        </div>

        <!-- Evolution Panel -->
        <div class="tab-panel" data-panel="evolution" role="tabpanel" aria-labelledby="tab-evolution"
            aria-hidden="true">
            <div class="content-wrapper">
                <h2>🔄 V1 vs V2 Evolution</h2>

                <!-- Comparison cards (existing) -->
                <div class="evolution-grid">
                    <!-- Before/after code snippets, metrics -->
                </div>
            </div>
        </div>

        <!-- Who Panel -->
        <div class="tab-panel" data-panel="who" role="tabpanel" aria-labelledby="tab-who" aria-hidden="true">
            <div class="content-wrapper">
                <h2>👥 The UV7 Crew</h2>

                <!-- Crew profiles (existing) -->
                <div class="crew-grid">
                    <!-- DiZee, Zee, GenZee, etc. -->
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar (existing) -->
    <div id="uv7-sidebar" class="sidebar">
        <!-- ... existing sidebar content ... -->
    </div>

    <!-- Scripts -->
    <script src="js/TabController.js"></script>
    <script src="js/SwipeController.js"></script>
    <script>
        // Initialize on DOM load
        document.addEventListener('DOMContentLoaded', () => {
            const tabController = new TabController();
            const container = document.querySelector('.tab-panels-container');
            if (container) {
                const swipeController = new SwipeController(tabController, container);
            }

            // Hero collapse on click when collapsed
            const hero = document.getElementById('hero-section');
            if (hero) {
                hero.addEventListener('click', () => {
                    if (hero.classList.contains('collapsed')) {
                        tabController.expandHero();
                    }
                });
            }

            console.log('🚀 Showcase tabbed navigation initialized');
        });
    </script>
</body>

</html>
