<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
    ═══════════════════════════════════════════════════════════════

    Ronnie has tried to save Tori 847 times.

    DIZEE'S RECIPE A IMPLEMENTATION

    <title>Version 848 - My Wife Is in a Coma... and in the Code</title>

    <style>
        /* DIZEE: Inline styles for that handcrafted feel 💚 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0f;
            color: #e0e0e0;
            overflow: hidden;
        }

        /* Loading screen - anxious boot sequence */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 1s;
        }

        #loading-text {
            font-size: 18px;
            color: #0f0;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* DIZEE: 800ms cursor blink - intentionally slow for anxiety 💚 */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #0f0;
            margin-left: 5px;
            animation: blink 800ms infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Main game view */
        #game-view {
            display: none;
            opacity: 0;
            transition: opacity 1s;
        }

        /* Status bar - UV7 OS aesthetic */
        #status-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 2px solid #0ff;
            display: flex;
            align-items: center;
            padding: 0 15px;
            justify-content: space-between;
            z-index: 1000;
            font-size: 14px;
        }

        #status-loop {
            color: #0ff;
            font-weight: bold;
        }

        /* Dialogue box - the heart of the experience */
        #dialogue-box {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            background: rgba(20, 20, 30, 0.95);
            border: 2px solid #0ff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        #character-name {
            font-size: 16px;
            color: #0ff;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #dialogue-text {
            font-size: 16px;
            line-height: 1.6;
            color: #fff;
            min-height: 60px;
        }

        #internal-thought {
            font-size: 14px;
            color: #888;
            font-style: italic;
            margin-top: 10px;
            display: none;
        }

        /* TORI'S ADDITION: Tether UI for anxiety mechanic 💚 */
        #tether-ui {
            position: fixed;
            top: 50px;
            right: 20px;
            display: none;
        }

        #tether-text {
            font-size: 14px;
            color: #0ff;
            margin-bottom: 5px;
        }

        #tether-bar {
            width: 150px;
            height: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #0ff;
            border-radius: 10px;
            overflow: hidden;
        }

        #tether-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0040, #ff4080);
            width: 100%;
            transition: width 0.5s ease-out, background 0.5s;
        }

        #tether-fill.low {
            background: linear-gradient(90deg, #ff0000, #ff4444);
        }

        /* ZEE'S ADDITION: Hold On button 🖤 */
        #hold-on-button {
            position: fixed;
            bottom: 150px;
            right: 20px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #0ff, #0aa);
            border: 2px solid #0ff;
            border-radius: 5px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            display: none;
            transition: all 0.3s;
        }

        #hold-on-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        }

        /* DIZEE: Matrix rain canvas - the atmosphere 💚 */
        #matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        /* TORI: Pulsing glow on status bar - anxious breathing 💔 */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(0, 255, 255, 0.3); }
            50% { box-shadow: 0 0 15px rgba(0, 255, 255, 0.6); }
        }

        #status-bar {
            animation: pulse-glow 3s infinite;
        }

        /* ZEE: Screen glitch effect - reality fragmenting 🖤 */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .glitch-active {
            animation: glitch 0.3s;
        }

        /* DIZEE: Tether bar pulsing when low 💚 */
        #tether-fill.low {
            animation: pulse-danger 1s infinite;
        }

        @keyframes pulse-danger {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- DIZEE: The Boot Sequence - Anxious system init 💚 -->
    <div id="loading-screen">
        <div id="loading-text">
            INITIALIZING VERSION 848<span class="cursor"></span>
        </div>
    </div>

    <!-- DIZEE: Matrix rain background - the digital void 💚 -->
    <canvas id="matrix-rain"></canvas>

    <!-- Main Game View -->
    <div id="game-view">
        <!-- Status Bar - UV7 OS -->
        <div id="status-bar">
            <div id="status-loop">v.848</div>
            <div id="status-route">SYSTEM READY</div>
        </div>

        <!-- Tether UI (Tori route only) -->
        <div id="tether-ui">
            <div id="tether-text">CONNECTION: <span id="tether-percentage">100%</span></div>
            <div id="tether-bar">
                <div id="tether-fill"></div>
            </div>
        </div>

        <!-- Hold On Button (Tori route only) -->
        <button id="hold-on-button">HOLD ON</button>

        <!-- Dialogue Box - The Soul -->
        <div id="dialogue-box">
            <div id="character-name"></div>
            <div id="dialogue-text"></div>
            <div id="internal-thought"></div>
        </div>
    </div>

    <!--
    DIZEE: Load the god class
    No module bundler. No framework. Just raw power.
    💚🔥💀
    -->
    <script src="dist/GameEngine.js"></script>

        // DIZEE: Boot the machine when page loads 💚
        window.addEventListener('DOMContentLoaded', () => {
            console.log('💚 Version 848 - Boot sequence initiated');
            console.log('🔥 "848 is sacred. 848 is the story. 848 is the one that worked."');
            console.log('💀 DiZee\'s Chaos Method - TypeScript with Soul from Line 1');

            // Initialize the god class
            window.game = new GameEngine();
        });
    </script>
</body>
</html>
