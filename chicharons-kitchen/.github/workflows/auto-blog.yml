# chicharons-kitchen — auto-blog on every commit to main
name: Auto Blog Entry

on:
  push:
    branches: ["main"]

jobs:
  auto-blog:
    name: Generate Blog Entry
    runs-on: ubuntu-latest

    # Skip if the push is from the bot itself
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate blog entry
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_DATE: ${{ github.event.head_commit.timestamp }}
          CHANGED_FILES: ${{ join(github.event.head_commit.added, '\n') }}
          SOURCE_REPO: ${{ github.event.repository.name }}
        run: node scripts/auto-blog-entry.js

      - name: Regenerate timeline index
        run: npm run generate:timeline

      - name: Commit new entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add entries/
          git diff --staged --quiet || git commit -m "📝 auto-blog: ${{ github.event.head_commit.message }}"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
