<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tori-Gatchi Gateway</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #0ff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Gateway Modal Styles */
        .gateway-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: fadeIn 0.5s ease-out;
        }

        .gateway-content {
            max-width: 600px;
            width: 90%;
            background: #0a0a0a;
            border: 2px solid #0ff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .gateway-screen {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid #0ff;
            border-radius: 5px;
            min-height: 200px;
        }

        .gateway-static {
            height: 2px;
            background: repeating-linear-gradient(90deg,
                    #0ff 0px,
                    transparent 2px,
                    transparent 4px);
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .gateway-dialogue p {
            margin: 10px 0;
            line-height: 1.6;
        }

        .gateway-line {
            color: #888;
            font-style: italic;
        }

        .gateway-tori {
            color: #0ff;
        }

        .gateway-tori.urgent {
            color: #f0f;
            font-weight: bold;
            animation: pulse 1s infinite;
        }

        .gateway-tori.corrupted {
            animation: glitchText 0.3s infinite;
        }

        .gateway-tori.fading {
            opacity: 0.5;
        }

        .gateway-system {
            color: #f00;
            font-weight: bold;
        }

        .gateway-echoes {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 255, 255, 0.2);
        }

        .gateway-echoes p {
            margin: 8px 0;
            font-size: 0.9em;
            opacity: 0.7;
        }

        .echo-1 {
            color: #0f0;
        }

        .echo-2 {
            color: #ff0;
        }

        .echo-despair {
            color: #f00;
        }

        .echo-despair.loud {
            font-weight: bold;
            animation: pulse 0.5s infinite;
        }

        .echo-despair.overwhelming {
            font-size: 1.2em;
            font-weight: bold;
        }

        .gateway-choices {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .gateway-btn {
            padding: 15px 30px;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #0ff;
            color: #0ff;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .gateway-btn:hover:not(:disabled) {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .gateway-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .gateway-yes {
            border-color: #0f0;
            color: #0f0;
        }

        .gateway-yes:hover:not(:disabled) {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .gateway-no {
            border-color: #f00;
            color: #f00;
        }

        .gateway-no:hover:not(:disabled) {
            background: rgba(255, 0, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .glitch-text {
            animation: glitchText 0.3s infinite;
        }

        .corruption-text {
            color: #f0f;
            animation: corruptFlicker 0.5s infinite;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        @keyframes glitchText {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-2px);
            }

            75% {
                transform: translateX(2px);
            }
        }

        @keyframes corruptFlicker {

            0%,
            100% {
                opacity: 1;
                color: #f0f;
            }

            50% {
                opacity: 0.7;
                color: #f00;
            }
        }

        @keyframes flicker {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* Glitch Levels */
        .glitch-level-1 .gateway-screen {
            animation: flicker 3s infinite;
        }

        .glitch-level-2 .gateway-screen {
            animation: glitchShake 0.5s infinite;
        }

        .glitch-level-3 .gateway-screen {
            animation: glitchShake 0.3s infinite, flicker 1s infinite;
        }

        .glitch-level-4 .gateway-content {
            animation: glitchShake 0.2s infinite;
            border-color: #f0f;
        }

        .glitch-level-5 .gateway-content {
            animation: glitchShake 0.1s infinite, corruptFlicker 0.5s infinite;
            border-color: #f00;
        }

        @keyframes glitchShake {

            0%,
            100% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-2px, 2px);
            }

            50% {
                transform: translate(2px, -2px);
            }

            75% {
                transform: translate(-2px, -2px);
            }
        }

        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        /* Corruption effects */
        .buzz-effect {
            animation: buzzShake 0.1s infinite;
        }

        @keyframes buzzShake {

            0%,
            100% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-1px, 1px);
            }

            50% {
                transform: translate(1px, -1px);
            }

            75% {
                transform: translate(-1px, -1px);
            }
        }

        .screen-tear {
            animation: screenTear 0.3s ease-out;
        }

        @keyframes screenTear {
            0% {
                clip-path: inset(0 0 0 0);
            }

            50% {
                clip-path: inset(20% 0 20% 0);
            }

            100% {
                clip-path: inset(0 0 0 0);
            }
        }
    </style>
</head>

<body>
    <!-- Gateway modal will be injected here by gateway.js -->

    <link rel="stylesheet" href="styles.css">
    <!-- Gateway modal will be injected here by script.js -->
    <script type="module" src="script.js"></script>
</body>

</html>
