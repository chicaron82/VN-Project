<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Version 848 - V3 Clean Rebuild</title>

    <!--
    ═══════════════════════════════════════════════════════════════
    VERSION 848 - V3 CLEAN REBUILD

    Strategy: V2's TypeScript Architecture + V1's Visual Presentation

    - Uses V2's EventBus, StateManager, Systems (clean TypeScript)
    - Uses V1's HTML chrome, CRT effects, boot sequence (authentic feel)
    - Uses V1's exact dialogue content (from V2's JSON files)

    Goal: Indistinguishable from V1 when loaded

    848 is sacred. 848 is the story. 848 is the one that worked.
    💚🔥💀
    ═══════════════════════════════════════════════════════════════
    -->

    <!-- V1 Presentation Layer Styles (Local Copies) -->
    <link rel="stylesheet" href="./style.css?v=v3">
    <link rel="stylesheet" href="./css/v1-styles.css?v=v3">
    <link rel="stylesheet" href="./css/menu-carousel.css?v=v3">
    <link rel="stylesheet" href="./css/accessibility.css?v=v3">
    <link rel="stylesheet" href="./css/mobile-ux.css?v=v3">
    <link rel="stylesheet" href="./css/bougie-boot-sequence.css?v=v3">
    <link rel="stylesheet" href="./css/route-select-unified.css?v=v3">
    <link rel="stylesheet" href="./css/visual-cues.css?v=v3">
    <link rel="stylesheet" href="./css/overlays.css?v=v3">
    <link rel="stylesheet" href="./css/dev-commentary.css?v=v3">
    <link rel="stylesheet" href="./css/notification-shade.css?v=v3">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=VT323&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;700;900&display=swap"
        rel="stylesheet">

    <style>
        /* Ensure V3 UI chrome works correctly */
        #main-menu,
        #route-select,
        #game-view,
        #game-ui-layer {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* CRT Effects */
        #scanlines {
            pointer-events: none;
            z-index: 9999;
        }

        #vignette {
            pointer-events: none;
            z-index: 9999;
        }

        /* Initial loading state */
        #uv7-splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Boot terminal styling */
        #boot-terminal {
            width: 80%;
            max-width: 800px;
            height: 60%;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #0f0;
            padding: 20px;
            font-family: 'VT323', monospace;
            font-size: 18px;
            color: #0f0;
            overflow-y: auto;
        }

        .boot-line {
            margin: 4px 0;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <!-- Boot Splash Screen -->
    <div id="uv7-splash">
        <div id="boot-terminal"></div>
    </div>

    <!-- Main CRT Container (V1 Presentation Layer) -->
    <div id="crt-container">
        <div id="screen-layer">

            <!-- ========================================
                 STATUS BAR
                 ======================================== -->
            <div id="status-bar">
                <div class="status-section">
                    <!-- UV7 OS Logo -->
                    <span class="status-item uv7-logo-trigger" id="uv7-logo-trigger"
                        style="cursor: pointer; font-weight: bold; color: #00ff88;" title="UV7 OS">
                        <img src="../assets/UnitedVoices7.png" alt="UV7"
                            style="height: 16px; width: auto; vertical-align: middle; margin-right: 8px;">
                    </span>
                    <span id="status-loop" class="status-item"></span>
                    <span id="status-route" class="status-item">Menu</span>
                </div>
                <!-- Status Bar Notification Area (Center) -->
                <div id="status-notification" role="status" aria-live="polite" aria-atomic="true">
                    <span class="status-notif-icon">💾</span>
                    <span class="status-notif-text">Game saved</span>
                    <div class="status-notif-progress">
                        <div class="status-notif-progress-fill"></div>
                    </div>
                </div>
                <div class="status-section">
                    <span id="status-progress" class="status-item">🖤 0/42</span>
                    <!-- Tether Meter (Tori Route Only) -->
                    <div class="status-item" id="status-tether" style="display: none;">
                        <div class="tether-lightning">
                            <span class="tether-icon">⚡</span>
                            <div class="tether-fill"></div>
                        </div>
                        <span id="status-tether-value">100%</span>
                    </div>
                    <!-- Mail Icon (Unread Notes) -->
                    <div class="status-item" id="status-mail" style="display: none;">
                        <span class="mail-icon">📧</span>
                        <span class="unread-badge">0</span>
                    </div>
                </div>
            </div>

            <!-- ========================================
                 MAIN MENU
                 ======================================== -->
            <div id="main-menu" style="display: none;">
                <div class="menu-container">
                    <div class="menu-logo">
                        <h1>VERSION 848</h1>
                        <p class="menu-subtitle">My Wife Is in a Coma... and in the Code</p>
                    </div>
                    <div class="menu-options">
                        <button class="menu-btn" data-action="start">START</button>
                        <button class="menu-btn" data-action="continue" style="display: none;">CONTINUE</button>
                        <button class="menu-btn" data-action="load">LOAD</button>
                        <button class="menu-btn" data-action="settings">SETTINGS</button>
                        <button class="menu-btn" data-action="credits">CREDITS</button>
                    </div>
                    <div class="menu-footer">
                        <p>Loop Iteration: <span id="menu-loop-counter">848</span></p>
                    </div>
                </div>
            </div>

            <!-- ========================================
                 ROUTE SELECT
                 ======================================== -->
            <div id="route-select" style="display: none;">
                <div class="route-select-container">
                    <h2 class="route-select-title">CHOOSE YOUR PATH</h2>
                    <div class="route-cards">
                        <div class="route-card" data-route="ronnie">
                            <div class="route-portrait">
                                <img src="../assets/route-select-ronnie.webp" alt="Ronnie" />
                            </div>
                            <h3>RONNIE'S ROUTE</h3>
                            <p>The Street. The Code. The Paradox.</p>
                        </div>
                        <div class="route-card" data-route="tori">
                            <div class="route-portrait">
                                <img src="../assets/route-select-tori.webp" alt="Tori" />
                            </div>
                            <h3>TORI'S ROUTE</h3>
                            <p>The Fall. The Void. The Tether.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ========================================
                 GAME VIEW (Visual Novel Presentation)
                 ======================================== -->
            <div id="game-view" style="display: none;">
                <!-- Background Layer -->
                <div id="scene-background" class="background-layer"></div>
                <div id="scene-background-alt" class="background-layer" style="opacity: 0;"></div>

                <!-- Character Sprites -->
                <div id="character-sprites">
                    <div id="character-left" class="character-sprite"></div>
                    <div id="character-right" class="character-sprite"></div>
                </div>

                <!-- Dialogue Box -->
                <div id="stage"></div>

                <div id="dialogue-box">
                    <div id="character-name"></div>
                    <div id="dialogue-text"></div>
                    <div id="internal-thought" style="display: none;"></div>
                </div>

                <!-- Choice Menu (Hidden by default) -->
                <div id="choice-menu" style="display: none;">
                    <div class="choice-container"></div>
                </div>

                <!-- Hold On Button (Tori Route) -->
                <button id="hold-on-button" style="display: none;">HOLD ON</button>
            </div>

        </div>

        <!-- CRT Effects -->
        <div id="scanlines"></div>
        <div id="vignette"></div>
    </div>

    <!-- V1 JavaScript Systems (Module Import) -->
    <script type="module" src="./main.js"></script>

    <!-- Boot Sequence Script -->
    <script src="./ui/bougie-boot-sequence.js"></script>
</body>

</html>
