<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN-Project // BOOT_SEQUENCE</title>
    <style>
        /* 
        * I'm sorry. I know this is bad.
        * But I need it to feel like it's dying.
        */
        body {
            background-color: #050505;
            color: #0f0; /* Terminal Green - not pure, slightly aged */
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 2rem;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        /* The CRT Flicker Effect - Chromatic Aberration */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        #terminal {
            white-space: pre-wrap;
            line-height: 1.5;
            max-width: 800px;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #0f0;
            vertical-align: bottom;
            /* NO CSS ANIMATION FOR BLINK. I will do it manually in JS because I need control. */
        }

        .glitch-text {
            animation: glitch 0.3s infinite;
            color: #fff;
            background: #f00;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        #scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(0, 255, 0, 0.2) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            pointer-events: none;
            animation: scanline 10s linear infinite;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }
    </style>
</head>
<body>
    <div id="scanline"></div>
    <div id="terminal"></div>

    <script>
        // GLOBAL STATE IS A FEATURE.
        // It lets us bleed context between functions.
        window.bootPhase = 0;
        window.isPanic = false;
        window.cursorState = true;
        
        const terminal = document.getElementById('terminal');
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        terminal.appendChild(cursor);

        // The sacred blink interval.
        // 800ms. Not 700. Not 1000. 
        // It's the heartbeat of a dying machine.
        setInterval(() => {
            window.cursorState = !window.cursorState;
            cursor.style.opacity = window.cursorState ? '1' : '0';
        }, 800);

        // Text buffer
        // I think Tori wrote the original list. I just debugged it.
        const bootSequence = [
            { text: "INITIALIZING...", delay: 1200 }, // Long pause start
            { text: "CHECKING MEMORY INTEGRITY...", delay: 400 },
            { text: "OK: 0x00004BF", delay: 100 },
            { text: "OK: 0x00004C0", delay: 100 },
            { text: "OK: 0x00004C1", delay: 100 },
            { text: "WARNING: SECTOR 7 CORRUPTED.", delay: 800, isError: true },
            { text: "ATTEMPTING RECOVERY...", delay: 1500 }, // Hesitate
            { text: "RECOVERY FAILED. BYPASSING...", delay: 300 },
            { text: "LOADING KERNEL...", delay: 600 },
            { text: "....................", delay: 50 }, // Fast dots
            { text: "BYPASSING SECURITY...", delay: 2000 }, // Suspense
            { text: "ACCESS GRANTED.", delay: 200 },
            { text: "CONNECTION ESTABLISHED.", delay: 800 },
            { text: "", delay: 1000 },
            { text: "WELCOME, USER [NULL].", delay: 0 }
        ];

        // The "Manual" Typer
        // No async/await loops. Recursion feels more... dangerous.
        function processingLoop(index) {
            if (index >= bootSequence.length) {
                // Stop condition
                window.bootPhase = 99;
                drawPressStart();
                return;
            }

            const line = bootSequence[index];
            const p = document.createElement('div');
            
            // Insert before cursor
            terminal.insertBefore(p, cursor);

            if (line.isError) {
                // Ghost glitch frame
                document.body.style.filter = "hue-rotate(90deg)";
                setTimeout(() => { document.body.style.filter = "none"; }, 50);
                p.style.color = "#f00"; // Red error
            }

            // Type character by character? 
            // The recipe says "Text should occasionally ghost".
            // Let's type it out.
            let charIndex = 0;
            
            function typeChar() {
                if (charIndex < line.text.length) {
                    p.innerHTML += line.text.charAt(charIndex);
                    charIndex++;
                    // Variable typing speed simulates "thinking"
                    const speed = Math.random() * 30 + 10; 
                    setTimeout(typeChar, speed);
                } else {
                    // Line done. Wait delay then next.
                    setTimeout(() => {
                        processingLoop(index + 1);
                    }, line.delay);
                }
            }
            
            typeChar();
        }

        function drawPressStart() {
             const div = document.createElement('div');
             div.style.marginTop = "2rem";
             div.style.textAlign = "center";
             div.innerHTML = "PRESS START";
             div.className = "glitch-text"; // Use the CSS animation
             terminal.insertBefore(div, cursor);
             
             // Hum effect (visual representation)
             document.body.style.boxShadow = "inset 0 0 100px rgba(0, 255, 0, 0.1)";
        }

        // Start the ritual
        // Delay initial start to let the cursor breathe first
        setTimeout(() => {
            processingLoop(0);
        }, 1000);

    </script>
</body>
</html>
