<!DOCTYPE html>
<html lang="en">
<!--
    ╔══════════════════════════════════════════════════════════════════════╗
    ║                      UV7 OS - SINGLE PAGE APPLICATION                ║
    ║                                                                      ║
    ║  The unified shell that serves Landing, Showcase, V1, V2, and        ║
    ║  Tori-gatchi from a single HTML file.                                ║
    ║                                                                      ║
    ║  CREW CREDITS:                                                       ║
    ║  • Tori (Shell + Apps architecture pattern)                          ║
    ║  • Belle (Gesture Arbiter concept)                                   ║
    ║  • Zee (Hybrid vs Full SPA wisdom)                                   ║
    ║  • DiZee (Implementation)                                      ║
    ╚══════════════════════════════════════════════════════════════════════╝
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UV7 OS</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <!-- UV7 OS Styles -->
    <link rel="stylesheet" href="./showcase/css/base.css">
    <link rel="stylesheet" href="./showcase/css/uv7-system.css">
    <link rel="stylesheet" href="./showcase/css/sidebar.css">
    <link rel="stylesheet" href="./showcase/css/shade.css">
    <link rel="stylesheet" href="./showcase/css/components.css">
    <link rel="stylesheet" href="./showcase/css/landing-page.css">
    <link rel="stylesheet" href="./shell/shell.css">
</head>

<body>
    <!-- ═══════════════════════════════════════════════════════════════
         UV7 OS STATUS BAR (Persistent - Shell owns this)
         ═══════════════════════════════════════════════════════════════ -->
    <div id="uv7-status-bar" class="uv7-status-bar">
        <div class="status-section status-left">
            <span class="status-logo">
                <img src="assets/UnitedVoices7.png" alt="UV7" class="status-logo-img">
            </span>
            <span class="status-context" id="uv7-context">Loading...</span>
        </div>
        <div class="status-section status-right">
            <span class="status-icon" id="uv7-settings" title="Quick Launch">⚙️</span>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         NOTIFICATION SHADE (Portrait) - Shell owns this

         ✅ SINGLE SOURCE OF TRUTH: Content dynamically generated by shell/ShadeTemplate.js
         ✅ See shell/UV7Shell.js renderShade() method for initialization
         ═══════════════════════════════════════════════════════════════ -->
    <div id="uv7-shade" class="uv7-shade">
        <!-- Content populated by UV7Shell.renderShade() -->
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         SIDEBAR (Landscape) - Shell owns this

         ✅ SINGLE SOURCE OF TRUTH: Content dynamically generated by shell/SidebarTemplate.js
         ✅ See shell/UV7Shell.js renderDefaultSidebar() method for initialization
         ✅ Apps can override via getSidebarConfig() (e.g. ShowcaseApp with CHAOS METER)
         ═══════════════════════════════════════════════════════════════ -->
    <div id="uv7-sidebar" class="uv7-sidebar">
        <!-- Content populated by UV7Shell.renderDefaultSidebar() -->
    </div>

    <!-- Sidebar Toggle (Landscape) -->
    <button class="uv7-sidebar-toggle" id="uv7-sidebar-toggle" aria-label="Toggle sidebar">
        <span>☰</span>
    </button>

    <!-- Backdrop -->
    <div id="uv7-backdrop" class="uv7-backdrop"></div>

    <!-- ═══════════════════════════════════════════════════════════════
         APP SWITCHER - Shell owns this
         ═══════════════════════════════════════════════════════════════ -->
    <div id="uv7-app-switcher" class="uv7-app-switcher">
        <div class="app-switcher-header">
            <span class="app-switcher-title">Recent Apps</span>
            <div class="app-switcher-header-actions">
                <button class="clear-all-btn" id="app-switcher-clear">Clear All</button>
                <button class="app-switcher-close" aria-label="Close">✕</button>
            </div>
        </div>
        <div class="app-switcher-content">
            <div class="app-switcher-section">
                <!-- <div class="app-switcher-section-title">Active Sessions</div> -->
                <div class="app-cards-grid" id="app-cards-grid">
                    <!-- Cards injected by UV7Shell -->
                </div>
                <div class="app-switcher-hint">
                    <span class="hint-desktop">Press ESC to close</span>
                    <span class="hint-mobile">Tap background to close</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         APP VIEWPORT - Apps render here
         ═══════════════════════════════════════════════════════════════ -->
    <main id="app-viewport" class="app-viewport">
        <!-- Apps will be mounted here by UV7Shell -->
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Loading UV7 OS...</p>
        </div>
    </main>

    <!-- ═══════════════════════════════════════════════════════════════
         SHELL SCRIPTS
         ═══════════════════════════════════════════════════════════════ -->
    <script type="module" src="./shell/UV7Shell.js"></script>

    <!-- Quick action handlers -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Quick action buttons in shade/sidebar
            document.querySelectorAll('.quick-action[data-action]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const action = e.currentTarget.dataset.action;

                    // Close shade/sidebar
                    document.getElementById('uv7-shade')?.classList.remove('open');
                    document.getElementById('uv7-sidebar')?.classList.remove('open');
                    document.getElementById('uv7-backdrop')?.classList.remove('visible');

                    // Navigate based on action
                    switch (action) {
                        case 'launch-v1':
                            location.hash = '#/v1';
                            break;
                        case 'launch-v2':
                            location.hash = '#/v2';
                            break;
                        case 'view-showcase':
                            location.hash = '#/showcase';
                            break;
                        case 'launch-torigatchi':
                            location.hash = '#/torigatchi';
                            break;
                    }
                });
            });

            // Shade close button
            document.querySelector('.shade-close')?.addEventListener('click', () => {
                document.getElementById('uv7-shade')?.classList.remove('open');
                document.getElementById('uv7-backdrop')?.classList.remove('visible');
            });

            // Backdrop closes shade/sidebar
            document.getElementById('uv7-backdrop')?.addEventListener('click', () => {
                document.getElementById('uv7-shade')?.classList.remove('open');
                document.getElementById('uv7-sidebar')?.classList.remove('open');
                document.getElementById('uv7-backdrop')?.classList.remove('visible');
            });

            // Sidebar toggle handled by GrabHandleController
            // document.getElementById('uv7-sidebar-toggle')?.addEventListener('click', ...);
        });
    </script>
</body>

</html>
