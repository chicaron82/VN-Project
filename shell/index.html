<!DOCTYPE html>
<html lang="en">
<!--
    ╔══════════════════════════════════════════════════════════════════════╗
    ║                      UV7 OS - SINGLE PAGE APPLICATION                ║
    ║                                                                      ║
    ║  The unified shell that serves Landing, Showcase, V1, V2, and        ║
    ║  Tori-gatchi from a single HTML file.                                ║
    ║                                                                      ║
    ║  CREW CREDITS:                                                       ║
    ║  • Tori (Shell + Apps architecture pattern)                          ║
    ║  • Belle (Gesture Arbiter concept)                                   ║
    ║  • Zee (Hybrid vs Full SPA wisdom)                                   ║
    ║  • Antigravity (Implementation)                                      ║
    ╚══════════════════════════════════════════════════════════════════════╝
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UV7 OS</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <!-- UV7 OS Styles -->
    <link rel="stylesheet" href="./showcase/uv7-os.css">
    <link rel="stylesheet" href="./showcase/uv7-app-switcher.css">
    <link rel="stylesheet" href="./showcase/css/landing-page.css">
    <link rel="stylesheet" href="./shell/shell.css">
</head>

<body>
    <!-- ═══════════════════════════════════════════════════════════════
         UV7 OS STATUS BAR (Persistent - Shell owns this)
         ═══════════════════════════════════════════════════════════════ -->
    <div id="uv7-status-bar" class="uv7-status-bar">
        <div class="status-section status-left">
            <span class="status-logo">
                <img src="assets/UnitedVoices7.png" alt="UV7" class="status-logo-img">
            </span>
            <span class="status-context" id="uv7-context">Loading...</span>
        </div>
        <div class="status-section status-right">
            <span class="status-icon" id="uv7-settings" title="Quick Launch">⚙️</span>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         NOTIFICATION SHADE (Portrait) - Shell owns this
         ═══════════════════════════════════════════════════════════════ -->
    <div id="uv7-shade" class="uv7-shade">
        <div class="shade-header">
            <span class="shade-title">🏠 UV7 OS Home</span>
            <button class="shade-close" aria-label="Close">✕</button>
        </div>
        <div class="shade-content">
            <!-- Quick Launch -->
            <div class="shade-section">
                <div class="shade-section-title">Quick Launch</div>
                <div class="quick-actions-grid">
                    <button class="quick-action" data-action="launch-v1">
                        <span class="quick-action-icon">🎮</span>
                        <span class="quick-action-label">V1 Game</span>
                    </button>
                    <button class="quick-action" data-action="launch-v2">
                        <span class="quick-action-icon">⚡</span>
                        <span class="quick-action-label">V2 Engine</span>
                    </button>
                    <button class="quick-action" data-action="view-showcase">
                        <span class="quick-action-icon">📖</span>
                        <span class="quick-action-label">Showcase</span>
                    </button>
                    <button class="quick-action" data-action="launch-torigatchi">
                        <span class="quick-action-icon">💖</span>
                        <span class="quick-action-label">Tori-gatchi</span>
                    </button>
                </div>
            </div>

            <!-- System Info -->
            <div class="shade-section">
                <div class="shade-section-title">System Info</div>
                <div class="current-phase">
                    <div>UV7 OS Shell</div>
                    <div style="font-size: 12px; opacity: 0.7;">Single-Page Architecture • Version 848</div>
                </div>
            </div>

            <!-- Carrier Branding -->
            <div class="shade-section" style="margin-top: auto; padding-top: 2rem;">
                <div class="uv7-carrier-branding" id="shade-carrier-brand">
                    <div class="carrier-logo">UV7</div>
                    <div class="carrier-text">United Voices 7</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         SIDEBAR (Landscape) - Shell owns this
         ═══════════════════════════════════════════════════════════════ -->
    <div id="uv7-sidebar" class="uv7-sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">🏠 UV7 OS</span>
        </div>
        <div class="sidebar-content">
            <div class="sidebar-section">
                <div class="sidebar-section-title">Quick Launch</div>
                <button class="quick-action" data-action="launch-v1" style="width: 100%; margin-bottom: 0.5rem;">
                    <span class="quick-action-icon">🎮</span>
                    <span class="quick-action-label">V1 Game</span>
                </button>
                <button class="quick-action" data-action="launch-v2" style="width: 100%; margin-bottom: 0.5rem;">
                    <span class="quick-action-icon">⚡</span>
                    <span class="quick-action-label">V2 Engine</span>
                </button>
                <button class="quick-action" data-action="view-showcase" style="width: 100%; margin-bottom: 0.5rem;">
                    <span class="quick-action-icon">📖</span>
                    <span class="quick-action-label">Showcase</span>
                </button>
                <button class="quick-action" data-action="launch-torigatchi" style="width: 100%;">
                    <span class="quick-action-icon">💖</span>
                    <span class="quick-action-label">Tori-gatchi</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Sidebar Toggle (Landscape) -->
    <button class="uv7-sidebar-toggle" id="uv7-sidebar-toggle" aria-label="Toggle sidebar">
        <span>☰</span>
    </button>

    <!-- Backdrop -->
    <div id="uv7-backdrop" class="uv7-backdrop"></div>

    <!-- ═══════════════════════════════════════════════════════════════
         APP VIEWPORT - Apps render here
         ═══════════════════════════════════════════════════════════════ -->
    <main id="app-viewport" class="app-viewport">
        <!-- Apps will be mounted here by UV7Shell -->
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Loading UV7 OS...</p>
        </div>
    </main>

    <!-- ═══════════════════════════════════════════════════════════════
         SHELL SCRIPTS
         ═══════════════════════════════════════════════════════════════ -->
    <script type="module" src="./shell/UV7Shell.js"></script>

    <!-- Quick action handlers -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Quick action buttons in shade/sidebar
            document.querySelectorAll('.quick-action[data-action]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const action = e.currentTarget.dataset.action;

                    // Close shade/sidebar
                    document.getElementById('uv7-shade')?.classList.remove('open');
                    document.getElementById('uv7-sidebar')?.classList.remove('open');
                    document.getElementById('uv7-backdrop')?.classList.remove('visible');

                    // Navigate based on action
                    switch (action) {
                        case 'launch-v1':
                            location.hash = '#/v1';
                            break;
                        case 'launch-v2':
                            location.hash = '#/v2';
                            break;
                        case 'view-showcase':
                            location.hash = '#/showcase';
                            break;
                        case 'launch-torigatchi':
                            location.hash = '#/torigatchi';
                            break;
                    }
                });
            });

            // Shade close button
            document.querySelector('.shade-close')?.addEventListener('click', () => {
                document.getElementById('uv7-shade')?.classList.remove('open');
                document.getElementById('uv7-backdrop')?.classList.remove('visible');
            });

            // Backdrop closes shade/sidebar
            document.getElementById('uv7-backdrop')?.addEventListener('click', () => {
                document.getElementById('uv7-shade')?.classList.remove('open');
                document.getElementById('uv7-sidebar')?.classList.remove('open');
                document.getElementById('uv7-backdrop')?.classList.remove('visible');
            });

            // Sidebar toggle
            document.getElementById('uv7-sidebar-toggle')?.addEventListener('click', () => {
                const sidebar = document.getElementById('uv7-sidebar');
                const backdrop = document.getElementById('uv7-backdrop');
                sidebar?.classList.toggle('open');
                backdrop?.classList.toggle('visible');
            });
        });
    </script>
</body>

</html>
